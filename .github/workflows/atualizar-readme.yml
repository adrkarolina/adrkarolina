name: Forçar Atualização do README

on:
  schedule:
    # Roda automaticamente a cada 6 horas
    - cron: '0 */6 * * *'
  push:
    branches:
      - main

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Atualizar marcador invisível
        run: |
          # Adiciona ou atualiza um comentário invisível no final do README com a data atual
          echo "<!-- Ultima atualizacao: $(date +'%Y-%m-%d %H:%M:%S') -->" >> README.md

      - name: Commit e Push automático
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: atualizando cache dos cards de estatísticas" || echo "Sem mudanças"
          git push
